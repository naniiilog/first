name = "botroom"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 휴대폰 브라우저용 웹 앱은 scripts/build-web.mjs가 서버 코드 안에 넣어요(src/web-assets.gen.js).

# 방을 저장하는 무료 데이터베이스(D1). 표는 첫 요청 때 자동으로 만들어져요.
# 직접 배포할 때는 `npx wrangler d1 create botroom`으로 만든 database_id로 바꾸세요.
[[d1_databases]]
binding = "DB"
database_name = "botroom"
database_id = "32bb0d65-357d-40a6-8088-ae75852a4ea8"

# (선택) 방 만들기에 비밀 문자열을 요구하려면:
#   npx wrangler secret put APP_TOKEN
