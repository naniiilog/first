name = "botroom-server"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# 방을 저장하는 무료 데이터베이스(D1).
#   npx wrangler d1 create botroom
# 를 실행하면 나오는 database_id를 아래에 붙여넣으세요. (표는 첫 요청 때 자동으로 만들어져요)
[[d1_databases]]
binding = "DB"
database_name = "botroom"
database_id = "00000000-0000-0000-0000-000000000000"

# (선택) 방 만들기에 비밀 문자열을 요구하려면:
#   npx wrangler secret put APP_TOKEN
