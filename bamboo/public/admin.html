<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>숲지기</title>
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숲지기">
<style>
  :root { --bg: #0d1b18; --card: #142824; --ink: #e9f3ec; --muted: #9db8ab; --line: #24413a; --accent: #8fe0a6; --danger: #ff8a7a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .mode { font-weight: 700; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  input, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  .login { display: flex; gap: 8px; } .login input { flex: 1; min-width: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; color: var(--muted); font-size: 14px; flex-wrap: wrap; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .item.hidden { border-color: var(--danger); opacity: .8; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .meta .sp { flex: 1; }
  .badge { color: var(--danger); font-weight: 700; }
  .sec { font-size: 15px; color: var(--muted); margin: 22px 0 8px; font-weight: 700; }
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat .k { color: var(--muted); font-size: 12.5px; }
  .stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.live .v { color: var(--accent); }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table.t th, table.t td { white-space: nowrap; padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t thead th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  table.t tr:last-child td { border-bottom: 0; }
  .crisis { color: #ffb4a6; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .liveTop { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px 12px; margin: 4px 0 10px; }
  .liveTop .lk { color: var(--muted); font-size: 13px; }
  .liveTop .lv { font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1.15; font-variant-numeric: tabular-nums; }
  .liveTop .ls { font-size: 14px; margin-top: 2px; }
  .liveTop .lu { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .enterForest { display: block; text-align: center; margin: 4px 0 12px; padding: 14px; border-radius: 14px; background: var(--accent); color: #0d1b18; font-weight: 700; font-size: 16px; text-decoration: none; }
  .danger { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎋 숲지기 (관리자)</h1>
  <form class="login" id="login">
    <input type="password" id="token" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button>들어가기</button>
  </form>
  <p id="loginNote" style="color:var(--muted);font-size:13px;margin:8px 2px 0">한 번 들어가면 이 기기에서는 기억해 둬요. 다른 사람과 같이 쓰는 기기라면 다 보고 나서 "나가기"를 눌러 주세요.</p>
  <div id="panel" hidden>
    <div class="liveTop" id="liveTop"><div class="lk">지금 숲에 있는 사람</div><div class="lv" id="liveNum">–</div><div class="ls" id="liveSplit"></div><div class="lu" id="liveUpd"></div></div>
    <a class="enterForest" href="/">🎋 숲지기로 대숲 들어가기</a>
    <div class="bar"><span id="summary"></span><span><button id="refresh">새로고침</button> <button id="pwBtn">비밀번호 바꾸기</button> <button id="logout">나가기</button></span></div>
    <form id="pwForm" class="item" hidden autocomplete="off">
      <div style="font-weight:700;margin-bottom:8px">새 비밀번호 정하기</div>
      <input type="password" id="pw1" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password" style="width:100%;margin-bottom:6px">
      <input type="password" id="pw2" placeholder="한 번 더 입력" autocomplete="new-password" style="width:100%;margin-bottom:8px">
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="pwCancel">취소</button><button id="pwSave" style="border-color:var(--accent);color:var(--accent)">바꾸기</button></div>
      <p style="color:var(--muted);font-size:12.5px;margin:8px 0 0">바꾼 비밀번호는 암호화해서 저장돼서 아무도 볼 수 없어요. 잊어버리면 되찾을 수 없으니 꼭 기억해 두세요.</p>
    </form>
    <section id="notifyBox" class="item" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div><b>🔔 알림</b> <span id="notifyState" style="color:var(--muted);font-size:13px"></span></div>
        <span><button id="notifyOn">알림 받기</button> <button id="notifyTest" hidden>시험 알림</button> <button id="notifyOff" hidden>끄기</button></span>
      </div>
      <p id="notifyHelp" style="color:var(--muted);font-size:12.5px;margin:8px 0 0;line-height:1.6">새 사연이 올라오거나 신고가 들어오면 바로, 방문자는 한 시간에 한 번 묶어서 알려드려요.</p>
    </section>
    <section id="stats"></section>
    <h2 class="sec">잎 목록</h2>
    <div id="list"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let token = '';
try { token = localStorage.getItem('bamboo.admin') || ''; } catch {}
const CRISIS = /(죽고\s*싶|죽을\s*래|죽어\s*버리|자살|살기\s*싫|살고\s*싶지\s*않|사라지고\s*싶|없어지고\s*싶|극단적|자해|목숨|살\s*이유|뛰어\s*내리|유서|끝내고\s*싶|손목)/;
const ago = (ms) => { const m = Math.floor(ms / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : Math.floor(m / 60) + '시간 전'; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function call(path, post) {
  const res = await fetch(path, { method: post ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + encodeURIComponent(token), 'content-type': 'application/json' }, body: post ? '{}' : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}
const n = (v) => (v || 0).toLocaleString('ko-KR');
async function loadStats() {
  try {
    const d = await call('/api/admin/stats');
    const L = d.live || {}, T = d.total || {}, D = d.todayStats || {};
    const liveAll = (L.plaza || 0) + (L.g0 || 0) + (L.g1 || 0) + (L.g2 || 0);
    $('liveNum').textContent = n(liveAll) + '명';
    $('liveSplit').textContent = `광장 ${n(L.plaza)} · 🍃 바람 ${n(L.g0)} · 🌙 달빛 ${n(L.g1)} · 💧 이슬 ${n(L.g2)}`;
    const t = new Date(); $('liveUpd').textContent = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}:${String(t.getSeconds()).padStart(2, '0')} 기준 · 20초마다 자동 갱신 · 숲지기는 빠져요`;
    const groves = [['🍃 바람 숲', 'g0'], ['🌙 달빛 숲', 'g1'], ['💧 이슬 숲', 'g2']];
    $('stats').innerHTML = `
      <h2 class="sec">숲 현황 <span style="font-weight:400">· ${d.today} 기준 (한국 시간)</span></h2>
      <div class="cards">
        <div class="stat live"><div class="k">지금 숲에 있는 사람</div><div class="v">${n(liveAll)}명</div><div class="s">광장 ${n(L.plaza)} · 바람 ${n(L.g0)} · 달빛 ${n(L.g1)} · 이슬 ${n(L.g2)}</div></div>
        <div class="stat"><div class="k">방문자</div><div class="v">${n(D.visits)}명</div><div class="s">오늘 · 누적 ${n(T.visits)}명</div></div>
        <div class="stat"><div class="k">털어놓은 말</div><div class="v">${n(D.leaves)}개</div><div class="s">오늘 · 누적 ${n(T.leaves)}개</div></div>
        <div class="stat"><div class="k">🍃 들었어요</div><div class="v">${n(D.heard)}번</div><div class="s">오늘 · 누적 ${n(T.heard)}번</div></div>
      </div>
      <h2 class="sec">숲별</h2>
      <table class="t"><thead><tr><th>숲</th><th>지금</th><th>방문<br><small>오늘 / 누적</small></th><th>털어놓은 말<br><small>오늘 / 누적</small></th></tr></thead><tbody>
        ${groves.map(([name, g]) => `<tr><td>${name}</td><td>${n(L[g])}</td><td>${n(D['visits_' + g])} / ${n(T['visits_' + g])}</td><td>${n(D['leaves_' + g])} / ${n(T['leaves_' + g])}</td></tr>`).join('')}
      </tbody></table>
      <h2 class="sec">털어놓은 방식 (누적)</h2>
      <table class="t"><tbody>
        <tr><td>🤫 속삭임</td><td>${n(T.leaves_whisper)}개</td></tr><tr><td>📣 소리침</td><td>${n(T.leaves_shout)}개</td></tr><tr><td>😮‍💨 한숨</td><td>${n(T.leaves_sigh)}개</td></tr>
      </tbody></table>
      <h2 class="sec">최근 7일</h2>
      <table class="t"><thead><tr><th>날짜</th><th>방문자</th><th>털어놓은 말</th></tr></thead><tbody>
        ${d.week.slice().reverse().map((w) => `<tr><td>${w.day.slice(5).replace('-', '/')}${w.day === d.today ? ' (오늘)' : ''}</td><td>${n(w.visits)}</td><td>${n(w.leaves)}</td></tr>`).join('')}
      </tbody></table>`;
  } catch (e) { $('stats').innerHTML = `<p style="color:var(--muted)">숫자를 불러오지 못했어요: ${esc(e.message)}</p>`; }
}
// ---------- 🔔 push notifications for the admin ----------
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
async function saveTokenForSW() { try { const c = await caches.open('bamboo-admin'); await c.put('/__token', new Response(token)); } catch {} }
const urlB64 = (s) => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, (c) => c.charCodeAt(0)); };
async function notifyStatus() {
  const st = $('notifyState'), on = $('notifyOn'), off = $('notifyOff'), test = $('notifyTest'), help = $('notifyHelp');
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    on.hidden = true;
    st.textContent = '이 브라우저에서는 알림을 받을 수 없어요';
    if (isIOS && !standalone) help.innerHTML = '아이폰은 Safari에서 <b>공유 버튼 → 홈 화면에 추가</b>를 누른 뒤, 홈 화면의 <b>숲지기</b> 아이콘으로 열어야 알림을 켤 수 있어요.';
    return;
  }
  const reg = await navigator.serviceWorker.getRegistration('/');
  const sub = reg && await reg.pushManager.getSubscription();
  const enabled = !!sub && Notification.permission === 'granted';
  on.hidden = enabled; off.hidden = !enabled; test.hidden = !enabled;
  st.textContent = enabled ? '켜져 있어요 (이 기기)' : Notification.permission === 'denied' ? '알림이 차단돼 있어요. 휴대폰 설정에서 이 사이트 알림을 허용해 주세요.' : '꺼져 있어요';
}
$('notifyOn').onclick = async () => {
  try {
    const { key } = await call('/api/admin/push/key');
    if (!key) throw new Error('서버 알림 설정이 아직 안 돼 있어요.');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { await notifyStatus(); return; }
    const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    await saveTokenForSW();
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(key) });
    const res = await fetch('/api/admin/push/subscribe', { method: 'POST', headers: { authorization: 'Bearer ' + encodeURIComponent(token), 'content-type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
    if (!res.ok) throw new Error('등록하지 못했어요.');
    await notifyStatus();
    alert('알림을 켰어요! "시험 알림"을 눌러 잘 오는지 확인해 보세요.');
  } catch (e) { alert(e.message); await notifyStatus(); }
};
$('notifyOff').onclick = async () => {
  const reg = await navigator.serviceWorker.getRegistration('/'); const sub = reg && await reg.pushManager.getSubscription();
  if (sub) { await fetch('/api/admin/push/unsubscribe', { method: 'POST', headers: { authorization: 'Bearer ' + encodeURIComponent(token), 'content-type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) }); await sub.unsubscribe(); }
  await notifyStatus();
};
$('notifyTest').onclick = async () => { try { await call('/api/admin/push/test', true); } catch (e) { alert(e.message); } };
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data === 'refresh') load(); });

async function load() {
  try {
    const { leaves, now } = await call('/api/admin/leaves');
    $('login').hidden = true; $('loginNote').hidden = true; $('panel').hidden = false;
    loadStats(); saveTokenForSW(); notifyStatus();
    const hidden = leaves.filter((l) => l.hidden).length;
    $('summary').textContent = `잎 ${leaves.length}장 · 숨김 ${hidden}장 · 신고 있는 잎 ${leaves.filter((l) => l.reports).length}장`;
    $('list').innerHTML = leaves.map((l) => `<div class="item${l.hidden ? ' hidden' : ''}">
      ${CRISIS.test(l.text) ? '<div class="crisis">🆘 위기 신호가 있는 글이에요</div>' : ''}<div class="text">${esc(l.text)}</div>
      <div class="meta"><span>#${l.id}</span><span class="mode">${({ whisper: '🤫 속삭임', shout: '📣 소리침', sigh: '😮‍💨 한숨' })[l.mode] || '🤫 속삭임'}</span><span>${ago(now - l.created)}</span><span>🍃 ${l.heard}</span>
        ${l.reports ? `<span class="badge">신고 ${l.reports}</span>` : ''}${l.hidden ? '<span class="badge">숨김</span>' : ''}<span class="sp"></span>
        <button data-act="${l.hidden ? 'unhide' : 'hide'}" data-id="${l.id}">${l.hidden ? '다시 보이기' : '숨기기'}</button>
        <button class="danger" data-act="delete" data-id="${l.id}">삭제</button></div></div>`).join('') || '<p style="color:var(--muted)">숲이 비어 있어요.</p>';
  } catch (e) {
    $('login').hidden = false; $('loginNote').hidden = false; $('panel').hidden = true;
    if (token) { alert(e.message); try { localStorage.removeItem('bamboo.admin'); } catch {} token = ''; }
  }
}
$('login').onsubmit = (e) => { e.preventDefault(); token = $('token').value.trim(); try { localStorage.setItem('bamboo.admin', token); } catch {} load(); };
$('logout').onclick = () => { token = ''; try { localStorage.removeItem('bamboo.admin'); } catch {} saveTokenForSW(); $('token').value = ''; load(); };
$('refresh').onclick = load;
$('pwBtn').onclick = () => { $('pwForm').hidden = !$('pwForm').hidden; $('pw1').value = $('pw2').value = ''; if (!$('pwForm').hidden) $('pw1').focus(); };
$('pwCancel').onclick = () => { $('pwForm').hidden = true; };
$('pwForm').onsubmit = async (e) => {
  e.preventDefault();
  const a = $('pw1').value, b = $('pw2').value;
  if (a.length < 6) { alert('비밀번호는 6자 이상으로 해 주세요.'); return; }
  if (a !== b) { alert('두 번 입력한 비밀번호가 서로 달라요.'); return; }
  try {
    const res = await fetch('/api/admin/password', { method: 'POST', headers: { authorization: 'Bearer ' + encodeURIComponent(token), 'content-type': 'application/json' }, body: JSON.stringify({ next: a }) });
    const d = await res.json().catch(() => ({})); if (!res.ok) throw new Error(d.error || res.status);
    token = a; try { localStorage.setItem('bamboo.admin', token); } catch {} saveTokenForSW();
    $('pwForm').hidden = true; alert('비밀번호를 바꿨어요. 이 기기에서는 계속 로그인돼 있어요.');
  } catch (err) { alert(err.message); }
};
$('list').onclick = async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'delete' && !confirm('이 잎을 완전히 삭제할까요?')) return;
  try { await call(`/api/admin/leaves/${b.dataset.id}/${b.dataset.act}`, true); load(); } catch (err) { alert(err.message); }
};
if (token) load();
setInterval(() => { if (token && !document.hidden && !$('panel').hidden) loadStats(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && token && !$('panel').hidden) loadStats(); });
</script>
</body>
</html>
