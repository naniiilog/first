name = "bamboo-forest"
main = "src/worker.js"
# the public site lives at bambooforest.pages.dev; this worker only runs the hourly cleanup
workers_dev = false
preview_urls = false
compatibility_date = "2025-09-01"

# The page files are bundled into the worker (see src/worker.js)
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.webmanifest"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.jpg"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "bamboo"
database_id = "93a64235-5c48-4f82-b02f-e21764777ca5"

[triggers]
crons = ["17 * * * *"]   # hourly cleanup of leaves older than 24h

# Secrets (set with `wrangler secret put`):
#   ADMIN_TOKEN  - password for /admin.html
#   SALT         - random string used to hash visitors (no raw IPs are stored)
